<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>七月气温</title>

  <script src="https://d3js.org/d3.v7.min.js" defer></script>
  <script src="./main.js" defer></script>

  <style>
    #chart { width: 100%; }
    #legend { width: 500px; }
    #year-slider { width: 60%; }

    #tooltip {
      position: fixed;
      background: white;
      border: 1px solid gray;
      padding: 8px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <select id="scenario-select" disabled></select>


  <svg id="chart"></svg>
  <svg id="legend"></svg>

  <label for="year-slider">years</label>
  <input id="year-slider" type="range"
         min="0" max="0" step="1" value="0" disabled>
  <output id="year-label"></output>

  <p id="status"></p>
  <div id="tooltip" hidden></div>
</body>
</html>
